[package]
name = "dirtransfer"
version = "0.5.0"
edition = "2021"
description = "Outil de transfert de repertoire via TCP chiffre (ChaCha20-Poly1305, code de jumelage) avec verification SHA-256 et reprise"
license = "MIT"
rust-version = "1.75"
keywords = ["transfer", "file-sharing", "encrypted", "tcp", "gui"]
categories = ["command-line-utilities", "gui"]

[[bin]]
name = "DirTransfert"
path = "src/main.rs"

[profile.release]
lto = true
strip = true

[dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"], optional = true }
slint = { version = "1.18", default-features = false, features = ["std", "renderer-skia", "backend-winit", "compat-1-18"], optional = true }

# Chiffrement du flux (option 2 : code de jumelage + AEAD)
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.9"
sha2 = "0.10"

[features]
default = ["slint-ui"]
slint-ui = ["slint", "rfd"]

[build-dependencies]
winresource = "0.1"

[package.metadata.deb]
maintainer = "0rmx0"
copyright = "2025, 0rmx0"
license-file = ["LICENSE"]
extended-description-file = "README.md"
depends = "libgl1, libegl1, libxkbcommon0, libwayland-client0, libfontconfig1"
section = "utils"
priority = "optional"
changelog = "debian/changelog"
assets = [
    ["target/release/DirTransfert", "usr/bin/dirtransfert", "755"],
    ["assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/dirtransfert.svg", "644"],
    ["packaging/dirtransfert.desktop", "usr/share/applications/dirtransfert.desktop", "644"],
]

[package.metadata.winresource]
icon = "assets/icon.ico"
