[package]
name = "dirtransfer"
version = "0.1.0"
edition = "2021"
description = "Outil de transfert de repertoire via TCP avec verification SHA-256 et reprise"
license = "MIT"

[profile.release]
lto = true
strip = true

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "x11", "glow"] }
rfd = { version = "0.17.2", features = ["default"] }
