name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux-amd64
            target: x86_64-unknown-linux-gnu
            artifact: DirTransfert-linux-amd64.tar.gz
          - os: ubuntu-latest
            os_name: linux-arm64
            target: aarch64-unknown-linux-gnu
            artifact: DirTransfert-linux-arm64.tar.gz
          - os: windows-latest
            os_name: windows-amd64
            target: x86_64-pc-windows-msvc
            artifact: DirTransfert-windows-amd64.zip
          - os: macos-latest
            os_name: macos-arm64
            target: aarch64-apple-darwin
            artifact: DirTransfert-macos-arm64.tar.gz
          - os: macos-latest
            os_name: macos-amd64
            target: x86_64-apple-darwin
            artifact: DirTransfert-macos-amd64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config
            sudo dpkg --add-architecture arm64
            sudo sh -c 'echo "Architectures: amd64,i386" >> /etc/apt/apt.conf.d/99-multiarch-restrict'
            printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe\n' | sudo tee /etc/apt/sources.list.d/arm64.list
            sudo apt-get update
            sudo apt-get install -y libfontconfig1-dev:arm64
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_PATH: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig' || '' }}
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '1' || '' }}
          PKG_CONFIG_SYSROOT_DIR: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '/' || '' }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/DirTransfert dist/
          cp README.md LICENSE dist/
          tar -czf ${{ matrix.artifact }} -C dist .
          shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\DirTransfert.exe dist\
          copy README.md dist\
          copy LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact }}
          Get-FileHash ${{ matrix.artifact }} -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } > ${{ matrix.artifact }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  deb:
    name: Build .deb (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build binary
        run: cargo build --release

      - name: Build .deb
        run: cargo deb --no-build --output dist/

      - name: Prepare artifact
        run: |
          ls -la dist/
          f=$(ls dist/*.deb | head -1)
          sha256sum "$f" > "$f.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirtransfert-deb
          path: dist/*

  release:
    name: Create release
    needs: [build, deb]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: ver
        run: echo "version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = \"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets/

      - name: Build release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 packaging/extract-release-notes.py "$VERSION" CHANGELOG.md release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG existe deja, ajout des assets"
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              --title "DirTransfert $VERSION" \
              --notes-file release-notes.md \
              --latest \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY"
          fi